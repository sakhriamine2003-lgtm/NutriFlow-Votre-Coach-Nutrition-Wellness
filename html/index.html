<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recettes App</title>
<link rel="stylesheet" href="/stylee/main.css">
</head>
<body>

  <header class="header">
    <div class="greeting">
      <h1>Hello, <span>Mark</span> 👋</h1>
      <p>Qu'est-ce qu'on cuisine aujourd'hui ?</p>
    </div>
    <div class="profile">
      <img src="https://cdn-icons-png.flaticon.com/128/1999/1999625.png" alt="Profil">
    </div>
  </header>

  

  <div class="search-bar">
    <input type="text" placeholder="Search by recipes">
  </div>

  <div class="categories">
    <button>DINNER</button>
    <button>LUNCH</button>
    <button>ALL</button>
    <button class="active">BREAKFAST</button>
  </div>

  <section class="recipe-list">
    <article class="recipe-card">
      <img src="https://destination-nature-unique.fr/wp-content/uploads/2025/05/Les-tresors-caches-de-la-cuisine-regionale.jpg" alt="Pasta">
      <div class="recipe-info">
        <h2>Une richesse culinaire à explorer</h2>
        <p>Mary Smith</p>
        <span>15 min</span>
        <span>⭐ 4.8</span>
      </div>
    </article>

    <article class="recipe-card">
      <img src="https://destination-nature-unique.fr/wp-content/uploads/2025/05/Les-tresors-caches-de-la-cuisine-regionale.jpg" alt="Pasta">
      <div class="recipe-info">
        <h2>Une richesse culinaire à explorer</h2>
        <p>Mary Smith</p>
        <span>15 min</span>
        <span>⭐ 4.8</span>
      </div>
    </article>
  </section>

  <nav class="bottom-nav">
    <button class="active">Home</button>
    <button>Date</button>
    <button>Listes</button>
    <button>Profil</button>
  </nav>
</body>
</html>
