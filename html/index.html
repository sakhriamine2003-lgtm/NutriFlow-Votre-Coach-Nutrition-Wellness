<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recipe App</title>

  <link rel="stylesheet" href="../stylee/main.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="flex justify-center" >

<div class="container">
<div id="home">
  <div class="header">
    <div>
      <h2>Hello, Mark 👋</h2>
      <p>What do you want to cook today?</p>
    </div>
    <img 
      src="https://cdn-icons-png.flaticon.com/128/6932/6932488.png" 
      class="avatar"
      alt="Profile">
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search by recipes">
  </div>

  <div class="video-card">
    <img 
      src="https://destination-nature-unique.fr/wp-content/uploads/2025/05/Les-tresors-caches-de-la-cuisine-regionale.jpg" 
      alt="Food video">
  </div>

  <div class="categories">
    <button>Dinner</button>
    <button>Lunch</button>
    <button>All</button>
    <button class="active">Breakfast</button>
  </div>

  <h1 class="text-2xl font-bold mb-5">Recipes</h1>

  <div id="loader" class="hidden">Loading...</div>

  <div id="plat"></div>
 
</div>

<div id="detail"></div>

</div>

<div class="fixed bottom-0 w-full bg-white flex justify-between items-center mx-8 p-3 shadow-md ">
  <div class="nav-item active">
    <img class="w-8" src="https://cdn-icons-png.flaticon.com/128/25/25694.png" alt="Home">
    <span>Home</span>
  </div>

  <div class="nav-item flex flex-col items-center">
    <img class="w-8 h-8 mb-1" src="https://cdn-icons-png.flaticon.com/128/2886/2886665.png" alt="Date">
    <span class="text-sm text-gray-700">Date</span>
  </div>

  <div class="nav-item flex flex-col items-center cursor-pointer">
    <img class="w-8 h-8 mb-1" src="https://cdn-icons-png.flaticon.com/128/1950/1950630.png" alt="Listes">
    <span class="text-sm text-gray-700">Listes</span>
  </div>

  <div class="nav-item flex flex-col items-center">
    <img class="w-8 h-8 mb-1" src="https://cdn-icons-png.flaticon.com/128/456/456212.png" alt="Profil">
    <span class="text-sm text-gray-700">Profil</span>
  </div>
</div>

<script type="module" src="../style/main/main.js"></script>

</body>
</html>
